name: Bug report
description: Report a reproducible Jaeger Workflows defect
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private prompts, provider transcripts, or unrelated machine data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a sanitized workflow and exact commands when possible.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux runtime host
        - Windows SSH controller
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant doctor output after removing hostnames, paths, and identifiers.
